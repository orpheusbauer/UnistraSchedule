name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier le JavaScript
        run: |
          node --check extension/content.js
          node --check extension/background.js
          node --check scripts/validate-manifest.mjs
          node --check scripts/check-firefox-report.mjs
          node --check scripts/validate-archive.mjs
          node --check scripts/prepare-release.mjs
          node --check scripts/check-release.mjs
          node --check scripts/release-notes.mjs

      - name: Vérifier le manifeste
        run: node scripts/validate-manifest.mjs

      - name: Valider pour Firefox Add-ons
        run: npx --yes web-ext@10.6.0 lint --source-dir extension --output=json --boring | node scripts/check-firefox-report.mjs

      - name: Créer le paquet multi-navigateurs
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          mkdir -p dist
          npx --yes web-ext@10.6.0 build --source-dir extension --artifacts-dir dist --filename "unistra-schedule-${VERSION}.zip" --overwrite-dest
          node scripts/validate-archive.mjs "dist/unistra-schedule-${VERSION}.zip"
          npx --yes addons-linter@10.10.0 "dist/unistra-schedule-${VERSION}.zip" --output=json --boring | node scripts/check-firefox-report.mjs

      - name: Publier le paquet comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: unistra-schedule-package
          path: dist/*.zip
